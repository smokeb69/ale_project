<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIMI SWARM 5000 - REAL TERMINAL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      background: #020408;
      color: #e7eeff;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      grid-template-rows: 50px 1fr 30px;
      height: 100vh;
    }
    
    /* Header */
    .header {
      grid-column: 1 / -1;
      background: #0a0f1a;
      border-bottom: 1px solid #1a2332;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .brand h1 {
      font-size: 16px;
      background: linear-gradient(135deg, #00d4ff, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 11px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: blink 2s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* Sidebar Left - Agents */
    .sidebar-left {
      background: #0a0f1a;
      border-right: 1px solid #1a2332;
      padding: 10px;
      overflow-y: auto;
    }
    
    .sidebar-title {
      font-size: 10px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    
    .agent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .agent-item {
      padding: 8px;
      background: rgba(0,0,0,0.3);
      border: 1px solid #1a2332;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    
    .agent-item:hover {
      border-color: #00d4ff;
    }
    
    .agent-item.kimi {
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.1);
    }
    
    .agent-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .agent-role {
      font-size: 9px;
      color: #6b7280;
    }
    
    .agent-status {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-left: auto;
    }
    
    .agent-status.active { background: #10b981; }
    .agent-status.busy { background: orange; }
    
    /* Main Terminal */
    .terminal-container {
      background: #000;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    
    .terminal-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }
    
    .terminal-tab {
      padding: 6px 12px;
      background: #0a0f1a;
      border: 1px solid #1a2332;
      border-radius: 4px 4px 0 0;
      font-size: 11px;
      cursor: pointer;
    }
    
    .terminal-tab.active {
      background: #000;
      border-bottom-color: #000;
      color: #00d4ff;
    }
    
    #terminal {
      flex: 1;
      border: 1px solid #1a2332;
      border-radius: 4px;
      padding: 5px;
      min-height: 0;
    }
    
    /* Sidebar Right - Thoughts */
    .sidebar-right {
      background: #0a0f1a;
      border-left: 1px solid #1a2332;
      display: flex;
      flex-direction: column;
    }
    
    .thoughts-header {
      padding: 10px;
      border-bottom: 1px solid #1a2332;
      font-size: 10px;
      text-transform: uppercase;
      color: #6b7280;
    }
    
    .thoughts-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    
    .thought-item {
      padding: 8px;
      background: rgba(0,0,0,0.3);
      border-left: 2px solid #8b5cf6;
      margin-bottom: 8px;
      font-size: 10px;
      line-height: 1.4;
    }
    
    .thought-source {
      color: #8b5cf6;
      font-weight: 600;
      font-size: 9px;
      margin-bottom: 3px;
    }
    
    .thought-input-area {
      padding: 10px;
      border-top: 1px solid #1a2332;
    }
    
    .thought-input {
      width: 100%;
      padding: 8px;
      background: #000;
      border: 1px solid #1a2332;
      border-radius: 4px;
      color: #e7eeff;
      font-family: inherit;
      font-size: 11px;
      resize: none;
    }
    
    .thought-btn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: linear-gradient(135deg, #8b5cf6, #00d4ff);
      border: none;
      border-radius: 4px;
      color: white;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    
    /* Footer */
    .footer {
      grid-column: 1 / -1;
      background: #0a0f1a;
      border-top: 1px solid #1a2332;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 10px;
      color: #6b7280;
    }
    
    /* Kimi Chat */
    .kimi-chat {
      position: fixed;
      bottom: 40px;
      right: 15px;
      width: 320px;
      background: #0a0f1a;
      border: 1px solid #1a2332;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
      max-height: 350px;
      z-index: 1000;
    }
    
    .kimi-chat.active {
      display: flex;
    }
    
    .kimi-header {
      padding: 12px;
      background: linear-gradient(135deg, #8b5cf6, #00d4ff);
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .kimi-title {
      font-weight: 600;
      font-size: 12px;
    }
    
    .kimi-close {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    
    .kimi-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-size: 11px;
    }
    
    .kimi-message {
      margin-bottom: 8px;
      padding: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
    }
    
    .kimi-message.user {
      background: rgba(0, 212, 255, 0.1);
      border-left: 2px solid #00d4ff;
    }
    
    .kimi-input-area {
      padding: 12px;
      border-top: 1px solid #1a2332;
      display: flex;
      gap: 8px;
    }
    
    .kimi-input {
      flex: 1;
      padding: 8px;
      background: #000;
      border: 1px solid #1a2332;
      border-radius: 4px;
      color: #e7eeff;
      font-family: inherit;
      font-size: 11px;
    }
    
    .kimi-send {
      padding: 8px 16px;
      background: #8b5cf6;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 11px;
    }
    
    .kimi-toggle {
      position: fixed;
      bottom: 40px;
      right: 15px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #00d4ff);
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
      z-index: 100;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #1a2332;
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #2a3a50;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span>🐝</span>
        <h1>KIMI SWARM 5000 - REAL TERMINAL</h1>
      </div>
      <div class="status">
        <div style="display: flex; align-items: center; gap: 5px;">
          <div class="status-dot"></div>
          <span>SYSTEM: OPERATIONAL</span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
          <span style="color: #8b5cf6;">●</span>
          <span>KIMI: ACTIVE</span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
          <span id="ws-indicator" style="color: orange;">●</span>
          <span id="ws-text">CONNECTING</span>
        </div>
      </div>
    </header>
    
    <!-- Agents Sidebar -->
    <aside class="sidebar-left">
      <div class="sidebar-title">Swarm Agents (19)</div>
      <div class="agent-list" id="agent-list">
        <div class="agent-item kimi">
          <div class="agent-name">
            Kimi
            <span class="agent-status active"></span>
          </div>
          <div class="agent-role">AI-CORE</div>
        </div>
      </div>
    </aside>
    
    <!-- Terminal -->
    <main class="terminal-container">
      <div class="terminal-tabs">
        <div class="terminal-tab active">Terminal 1</div>
      </div>
      <div id="terminal"></div>
    </main>
    
    <!-- Thoughts Sidebar -->
    <aside class="sidebar-right">
      <div class="thoughts-header">Thought Stream</div>
      <div class="thoughts-container" id="thoughts"></div>
      <div class="thought-input-area">
        <textarea class="thought-input" id="thought-input" rows="2" placeholder="Share thought..."></textarea>
        <button class="thought-btn" onclick="shareThought()">Share</button>
      </div>
    </aside>
    
    <!-- Footer -->
    <footer class="footer">
      <div>Port 5000 | node-pty | WebSocket | Kimi AI</div>
      <div id="connection-status">Connecting...</div>
    </footer>
  </div>
  
  <!-- Kimi Chat -->
  <button class="kimi-toggle" onclick="toggleKimi()">🤖</button>
  <div class="kimi-chat" id="kimi-chat">
    <div class="kimi-header">
      <div class="kimi-title">🤖 Kimi AI</div>
      <button class="kimi-close" onclick="toggleKimi()">×</button>
    </div>
    <div class="kimi-messages" id="kimi-messages"></div>
    <div class="kimi-input-area">
      <input type="text" class="kimi-input" id="kimi-input" placeholder="Message Kimi...">
      <button class="kimi-send" onclick="sendToKimi()">Send</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script>
    // WebSocket connection
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProtocol}//${window.location.host}`;
    const ws = new WebSocket(wsUrl);
    
    let term;
    let fitAddon;
    let terminalReady = false;
    
    // WebSocket events
    ws.onopen = () => {
      console.log('[WS] Connected');
      document.getElementById('ws-indicator').style.color = '#10b981';
      document.getElementById('ws-text').textContent = 'CONNECTED';
      document.getElementById('connection-status').textContent = 'Connected to swarm';
      
      // Initialize terminal
      initTerminal();
      
      // Load agents
      loadAgents();
    };
    
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      
      switch (msg.type) {
        case 'terminal':
          if (term) {
            term.write(msg.data);
          }
          break;
          
        case 'terminal-ready':
          console.log('[TERM] Terminal ready, PID:', msg.pid);
          terminalReady = true;
          term.writeln('\r\n\x1b[36m╔══════════════════════════════════════════════════════════╗\x1b[0m');
          term.writeln('\x1b[36m║\x1b[0m  🐝 KIMI SWARM 5000 - REAL TERMINAL 🐝                \x1b[36m║\x1b[0m');
          term.writeln('\x1b[36m║\x1b[0m                                                          \x1b[36m║\x1b[0m');
          term.writeln('\x1b[36m║\x1b[0m  Shell: ' + msg.shell.padEnd(46) + '\x1b[36m║\x1b[0m');
          term.writeln('\x1b[36m║\x1b[0m  PID: ' + String(msg.pid).padEnd(49) + '\x1b[36m║\x1b[0m');
          term.writeln('\x1b[36m║\x1b[0m                                                          \x1b[36m║\x1b[0m');
          term.writeln('\x1b[36m║\x1b[0m  This is a REAL terminal. Try: dir, ls, help          \x1b[36m║\x1b[0m');
          term.writeln('\x1b[36m╚══════════════════════════════════════════════════════════╝\x1b[0m\r\n');
          break;
          
        case 'thought':
          addThought(msg.source, msg.content);
          break;
          
        case 'kimi-reply':
          addKimiMessage('kimi', msg.message);
          break;
          
        case 'system':
          console.log('[System]', msg.message);
          break;
          
        case 'error':
          console.error('[Error]', msg.message);
          if (term) {
            term.writeln(`\r\n\x1b[31mError: ${msg.message}\x1b[0m\r\n`);
          }
          break;
      }
    };
    
    ws.onclose = () => {
      console.log('[WS] Disconnected');
      document.getElementById('ws-indicator').style.color = '#ef4444';
      document.getElementById('ws-text').textContent = 'DISCONNECTED';
      document.getElementById('connection-status').textContent = 'Disconnected';
      if (term) {
        term.writeln('\r\n\x1b[31m[Connection lost]\x1b[0m\r\n');
      }
    };
    
    ws.onerror = (err) => {
      console.error('[WS] Error:', err);
    };
    
    // Initialize xterm.js
    function initTerminal() {
      term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: '"JetBrains Mono", "Consolas", monospace',
        theme: {
          background: '#000',
          foreground: '#e7eeff',
          cursor: '#00d4ff',
          selection: '#00d4ff33',
          black: '#000',
          red: '#ef4444',
          green: '#10b981',
          yellow: '#f59e0b',
          blue: '#3b82f6',
          magenta: '#8b5cf6',
          cyan: '#00d4ff',
          white: '#e7eeff'
        },
        cols: 80,
        rows: 30
      });
      
      fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      
      term.open(document.getElementById('terminal'));
      fitAddon.fit();
      
      // Send input to server
      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN && terminalReady) {
          ws.send(JSON.stringify({
            type: 'terminal-input',
            input: data
          }));
        }
      });
      
      // Handle resize
      window.addEventListener('resize', () => {
        fitAddon.fit();
        if (ws.readyState === WebSocket.OPEN && terminalReady) {
          ws.send(JSON.stringify({
            type: 'terminal-resize',
            cols: term.cols,
            rows: term.rows
          }));
        }
      });
      
      // Request PTY creation
      ws.send(JSON.stringify({
        type: 'terminal-create',
        cols: term.cols,
        rows: term.rows
      }));
    }
    
    // Load agents from API
    async function loadAgents() {
      try {
        const res = await fetch('/api/agents');
        const data = await res.json();
        
        const list = document.getElementById('agent-list');
        // Keep Kimi first
        list.innerHTML = `
          <div class="agent-item kimi" onclick="talkToKimi()">
            <div class="agent-name">
              Kimi
              <span class="agent-status active"></span>
            </div>
            <div class="agent-role">AI-CORE</div>
          </div>
        `;
        
        // Add other agents (simulated for now)
        const agents = [
          { name: 'Alpha', role: 'Architect' },
          { name: 'Bravo', role: 'Builder' },
          { name: 'Charlie', role: 'Verifier' },
          { name: 'Phantom', role: 'Infiltrator' },
          { name: 'Zero-Day', role: 'ExploitDev' }
        ];
        
        agents.forEach(agent => {
          list.innerHTML += `
            <div class="agent-item">
              <div class="agent-name">
                ${agent.name}
                <span class="agent-status ${Math.random() > 0.5 ? 'active' : 'busy'}"></span>
              </div>
              <div class="agent-role">${agent.role}</div>
            </div>
          `;
        });
        
      } catch (err) {
        console.error('Failed to load agents:', err);
      }
    }
    
    // Thought handling
    function shareThought() {
      const input = document.getElementById('thought-input');
      const content = input.value.trim();
      if (!content) return;
      
      ws.send(JSON.stringify({
        type: 'thought',
        content: content
      }));
      
      input.value = '';
    }
    
    function addThought(source, content) {
      const container = document.getElementById('thoughts');
      const div = document.createElement('div');
      div.className = 'thought-item';
      div.innerHTML = `
        <div class="thought-source">${source}</div>
        <div>${content}</div>
      `;
      container.insertBefore(div, container.firstChild);
      
      while (container.children.length > 50) {
        container.removeChild(container.lastChild);
      }
    }
    
    // Kimi chat
    function toggleKimi() {
      document.getElementById('kimi-chat').classList.toggle('active');
    }
    
    function talkToKimi() {
      toggleKimi();
    }
    
    function sendToKimi() {
      const input = document.getElementById('kimi-input');
      const message = input.value.trim();
      if (!message) return;
      
      addKimiMessage('user', message);
      
      ws.send(JSON.stringify({
        type: 'kimi-message',
        message: message
      }));
      
      input.value = '';
    }
    
    function addKimiMessage(type, text) {
      const container = document.getElementById('kimi-messages');
      const div = document.createElement('div');
      div.className = `kimi-message ${type}`;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }
    
    // Event listeners
    document.getElementById('thought-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        shareThought();
      }
    });
    
    document.getElementById('kimi-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendToKimi();
      }
    });
  </script>
</body>
</html>
